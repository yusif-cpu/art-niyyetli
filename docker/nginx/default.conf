server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 20M;

    # Security headers for everything PHP serves (pages, API, errors) are set by the application
    # (App\Http\Middleware\SecurityHeaders); adding them here as well would send each one twice.
    # Only files nginx serves itself are covered below: `add_header` in this location does not apply to
    # requests that fall through to PHP, which are handled in the `.php` location instead.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
