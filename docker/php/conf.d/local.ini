; GD-based image variant generation on artwork photography needs headroom
; beyond PHP's 128M compiled-in default (a 3000x2000 truecolor image alone is
; ~23MB in memory before any resampling copies).
memory_limit = 256M

; Must comfortably clear the application's 10 MB media upload limit
; (config/media.php: max_upload_kb). post_max_size must exceed
; upload_max_filesize to leave room for the request's other form fields.
upload_max_filesize = 12M
post_max_size = 13M

; Do not advertise the PHP version in an X-Powered-By response header.
; Takes effect when the app image is rebuilt (this file is COPYed, not mounted).
expose_php = Off
