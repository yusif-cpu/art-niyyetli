server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 20M;

    # Do not advertise the nginx version (`Server: nginx/x.y.z`).
    server_tokens off;

    # Compression for text responses (HTML, JSON, JS, CSS, XML, SVG). Already-compressed formats (images, woff/woff2)
    # are deliberately not listed. `gzip_vary` sends `Vary: Accept-Encoding` on every compressible response so that
    # shared caches never hand a gzipped body to a client that did not ask for one.
    # Not enabled here (Phase 13, production edge): brotli, which is not in the stock nginx image and would need a
    # module; and `gzip_proxied`, which defaults to "off" and so skips requests that arrive with a `Via` header — set
    # it if a CDN or load balancer sits in front of this server.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/xml image/svg+xml;

    # Security headers for everything PHP serves (pages, API, errors) are set by the application
    # (App\Http\Middleware\SecurityHeaders); adding them here as well would send each one twice.
    # Only files nginx serves itself are covered below: `add_header` in this location does not apply to
    # requests that fall through to PHP, which are handled in the `.php` location instead.
    #
    # Caching: nothing here sets Cache-Control. HTML, the admin, the API, the sitemap and robots.txt all come from PHP
    # and keep the validators the application gives them (App\Http\Middleware\PublicApiCacheHeaders, the shell's ETag);
    # unhashed files such as /build/manifest.json and favicon.ico are revalidated with their ETag/Last-Modified.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite output. EVERY file under /build/assets/ has a content hash in its name (main-BN3B3Zw2.js), so a URL never
    # changes meaning and can be cached for a year without revalidation. This is only safe because of the hash: never
    # add `immutable` anywhere else, and never to /build/manifest.json (which lives outside assets/ on purpose).
    # The header is not sent with `always`, so a 404 for a missing file is never cached as immutable.
    location /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Public media variants (storage/app/public via the public/storage symlink). The application writes each variant
    # file once, at a path that contains the media id and a random token, and only from upload(): a URL is never
    # rewritten with different bytes, so a day of browser caching cannot show a stale image. A deleted file can still
    # be served from a browser cache for up to a day. If a "regenerate variants" feature is ever added (it would
    # overwrite files in place), give the regenerated files new URLs or revisit this TTL.
    #
    # The deny below MUST stay above the `.php` location: nginx uses the first matching regex location, so an uploaded
    # script under /storage would otherwise be handed to PHP-FPM.
    location ~* ^/storage/.*\.(php|phtml|phar)$ {
        deny all;
    }

    location /storage/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
